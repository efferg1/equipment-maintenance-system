server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: equipment-maintenance-system

  datasource:
    url: jdbc:h2:mem:ems;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  thymeleaf:
    cache: false
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.cuijian.ems: DEBUG
